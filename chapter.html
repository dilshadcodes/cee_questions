<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter — MCQ Bank</title>
<link rel="stylesheet" href="style.css">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">📚</div>
      <div class="brand-text">
        <h1 class="app-title">CEE Copilot</h1>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <a href="index.html" class="back-link" id="back-link">&larr; All chapters</a>

  <div class="chapter-hero">
    <div class="hero-icon" id="hero-icon" aria-hidden="true">📖</div>
    <div>
      <h1 id="chapter-title" class="chapter-title">Loading…</h1>
      <p id="chapter-meta" class="chapter-meta"></p>
    </div>
  </div>

  <div id="questions" class="questions">
    <p class="loading">Loading questions…</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get('id');
  const DEFAULT_MODE = 'questions';
  const MODE_TITLES = { lectures: 'Lectures', notes: 'Notes', questions: 'Questions' };
  const MODE_ICONS = { lectures: '🎬', notes: '📝', questions: '❓' };
  let mode = params.get('mode') || DEFAULT_MODE;
  if (!MODE_TITLES[mode]) mode = DEFAULT_MODE;

  function getModeEntry(ch, mode) {
    // New schema: ch[mode] = { file, count }.
    if (ch[mode] && ch[mode].file) return ch[mode];
    // Legacy schema fallback: a flat { file, count } was always Questions-mode data.
    if (mode === 'questions' && ch.file) return { file: ch.file, count: ch.count };
    return null;
  }

  function getSubject(name) {
    const n = name.toUpperCase();
    if (n.includes('BOTANY')) return 'Botany';
    if (n.includes('PHYSICS')) return 'Physics';
    return 'Other';
  }

  function getSubjectIcon(subject) {
    return subject === 'Botany' ? '🌿' : subject === 'Physics' ? '⚛️' : '📖';
  }

  if (!chapterId) {
    document.getElementById('chapter-title').textContent = 'No chapter specified';
    document.getElementById('questions').innerHTML =
      '<p class="error">Go back and pick a chapter from the list.</p>';
  } else {
    fetch('chapters.json')
      .then(res => res.json())
      .then(chapters => {
        const chapter = chapters.find(c => c.id === chapterId);
        if (!chapter) throw new Error(`Chapter "${chapterId}" not found`);

        const subject = getSubject(chapter.name);
        document.getElementById('chapter-title').textContent = chapter.name;
        document.getElementById('chapter-meta').textContent =
          `${MODE_ICONS[mode]} ${MODE_TITLES[mode]} · ${subject}`;
        document.getElementById('hero-icon').textContent = getSubjectIcon(subject);
        document.title = `${chapter.name} — ${MODE_TITLES[mode]}`;

        const entry = getModeEntry(chapter, mode);
        if (!entry) {
          document.getElementById('questions').innerHTML =
            `<p class="empty-state">${MODE_TITLES[mode]} for this chapter are coming soon.</p>`;
          return null;
        }

        return fetch(entry.file);
      })
      .then(res => {
        if (res === null) return null;
        if (!res.ok) throw new Error(`Could not load ${MODE_TITLES[mode].toLowerCase()} file`);
        return res.json();
      })
      .then(data => {
        if (data === null) return;
        const container = document.getElementById('questions');
        container.innerHTML = '';

        if (mode === 'lectures') {
          container.className = 'lectures';

          data.lectures.forEach(lec => {
            const a = document.createElement('a');
            a.className = 'lecture-card';
            a.href = `https://www.youtube.com/watch?v=${lec.youtubeId}`;
            a.target = '_blank';
            a.rel = 'noopener';

            a.innerHTML = `
              <div class="lecture-thumb">
                <img src="https://img.youtube.com/vi/${lec.youtubeId}/hqdefault.jpg" alt="" loading="lazy">
                <div class="play-badge">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <div class="lecture-title"><span class="lecture-title-text">${lec.title}</span></div>
            `;
            container.appendChild(a);
          });
          return;
        }

        data.questions.forEach(q => {
          const div = document.createElement('div');
          div.className = 'question';

          const optionsHtml = q.options.map(opt => `
            <li><span class="label">${opt.label}.</span>${opt.text}</li>
          `).join('');

          div.innerHTML = `
            <div class="question-header">
              <span class="qnum">Q${q.number}</span>
            </div>
            <p class="qtext">${q.question}</p>
            <ul class="options">${optionsHtml}</ul>
          `;
          container.appendChild(div);
        });

        // Ask MathJax to typeset the newly inserted content
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise();
        }
      })
      .catch(err => {
        document.getElementById('chapter-title').textContent = 'Error';
        document.getElementById('questions').innerHTML =
          `<p class="error">${err.message}</p>`;
      });
  }
</script>

</body>
</html>
