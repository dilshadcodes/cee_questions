<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEE Copilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <h1 class="app-title">CEE Copilot</h1>
  <p class="subtitle">Select a chapter to view its content.</p>

  <div id="mode-switch" class="mode-switch" role="tablist" aria-label="Content mode">
    <button type="button" class="mode-btn" data-mode="lectures" role="tab">Lectures</button>
    <button type="button" class="mode-btn" data-mode="notes" role="tab">Notes</button>
    <button type="button" class="mode-btn" data-mode="questions" role="tab">Questions</button>
  </div>

  <div id="chapter-list" class="chapter-list">
    <p class="loading">Loading chapters…</p>
  </div>
</div>

<script>
  const MODE_STORAGE_KEY = 'ceeMode';
  const DEFAULT_MODE = 'questions';
  const MODE_LABELS = { lectures: 'lecture', notes: 'note', questions: 'question' };

  const modeButtons = document.querySelectorAll('.mode-btn');
  let currentMode = localStorage.getItem(MODE_STORAGE_KEY) || DEFAULT_MODE;
  if (!MODE_LABELS[currentMode]) currentMode = DEFAULT_MODE;

  let chaptersData = null;

  function setActiveButton() {
    modeButtons.forEach(btn => {
      const isActive = btn.dataset.mode === currentMode;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  }

  function getModeEntry(ch, mode) {
    // New schema: ch[mode] = { file, count }.
    if (ch[mode] && ch[mode].file) return ch[mode];
    // Legacy schema fallback: a flat { file, count } was always Questions-mode data.
    if (mode === 'questions' && ch.file) return { file: ch.file, count: ch.count };
    return null;
  }

  function renderChapters() {
    const container = document.getElementById('chapter-list');
    if (!chaptersData) return;
    container.innerHTML = '';

    if (!chaptersData.length) {
      container.innerHTML = '<p class="loading">No chapters added yet.</p>';
      return;
    }

    chaptersData.forEach(ch => {
      const entry = getModeEntry(ch, currentMode);
      if (!entry) return;

      const card = document.createElement('a');
      card.className = 'chapter-card';
      card.href = `chapter.html?id=${encodeURIComponent(ch.id)}&mode=${encodeURIComponent(currentMode)}`;

      const countLabel = entry.count
        ? `${entry.count} ${MODE_LABELS[currentMode]}${entry.count === 1 ? '' : 's'}`
        : '';

      card.innerHTML = `
        <span class="chapter-name">${ch.name}</span>
        <span class="chapter-count">${countLabel}</span>
      `;
      container.appendChild(card);
    });
  }

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      localStorage.setItem(MODE_STORAGE_KEY, currentMode);
      setActiveButton();
      renderChapters();
    });
  });

  setActiveButton();

  fetch('chapters.json')
    .then(res => {
      if (!res.ok) throw new Error('Could not load chapters.json');
      return res.json();
    })
    .then(chapters => {
      chaptersData = chapters;
      renderChapters();
    })
    .catch(err => {
      document.getElementById('chapter-list').innerHTML =
        `<p class="error">Failed to load chapters: ${err.message}</p>`;
    });
</script>

</body>
</html>
